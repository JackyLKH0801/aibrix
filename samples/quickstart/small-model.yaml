apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    model.aibrix.ai/name: qwen2.5-1.5b-instruct
    model.aibrix.ai/port: "8000"
  name: qwen2.5-1.5b-instruct
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      model.aibrix.ai/name: qwen2.5-1.5b-instruct
      model.aibrix.ai/port: "8000"
  template:
    metadata:
      labels:
        model.aibrix.ai/name: qwen2.5-1.5b-instruct
        model.aibrix.ai/port: "8000"
      annotations:
        model.aibrix.ai/sidecar-injection: "true"
    spec:
      volumes:
        - name: lora-storage
          persistentVolumeClaim:
            claimName: lora-storage
      containers:
        - command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --uvicorn-log-level
            - warning
            - --model
            - Qwen/Qwen2.5-1.5B-Instruct
            - --served-model-name
            - qwen2.5-1.5b-instruct
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.85"
            - --enable-lora
          image: vllm/vllm-openai:latest
          imagePullPolicy: Always
          name: vllm-openai
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: lora-storage
              mountPath: /data
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            failureThreshold: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            failureThreshold: 120
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
        - name: aibrix-runtime
          image: aibrix/runtime:v0.4.0
          command:
            - aibrix_runtime
            - --port
            - "8080"
          env:
            - name: INFERENCE_ENGINE
              value: vllm
            - name: INFERENCE_ENGINE_ENDPOINT
              value: http://localhost:8000
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: lora-storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
